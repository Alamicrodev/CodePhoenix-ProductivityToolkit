name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codephoenix
          POSTGRES_PASSWORD: codephoenix
          POSTGRES_DB: codephoenix_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U codephoenix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://codephoenix:codephoenix@localhost:5432/codephoenix_test
      TEST_DATABASE_URL: postgresql+psycopg://codephoenix:codephoenix@localhost:5432/codephoenix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      # Regression guard for the alembic startup bug: migrations must apply
      # cleanly to an empty database before anything else runs.
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # npm ci must run BEFORE docker compose: on Linux, compose creates the
      # Frontend/node_modules volume mountpoint as root, which makes a later
      # npm ci fail with EACCES.
      - name: Install dependencies
        working-directory: Frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: Frontend
        run: npx playwright install --with-deps chromium
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for backend and frontend
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/api/v1/health > /dev/null && break; sleep 2; done
          for i in $(seq 1 60); do curl -fsS http://localhost:5173 > /dev/null && break; sleep 2; done
          curl -fsS http://localhost:8000/api/v1/health
      - name: Run E2E tests
        working-directory: Frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/playwright-report
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 100
