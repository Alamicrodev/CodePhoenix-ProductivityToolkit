# Render Blueprint for the CodePhoenix FastAPI backend.
# Docs: https://render.com/docs/blueprint-spec
#
# The frontend stays on Vercel; this deploys ONLY the backend. The database is
# hosted Supabase (set DATABASE_URL to the session-pooler string in the Render
# dashboard — see backend/README.md "Using a hosted Supabase database").
services:
  - type: web
    name: codephoenix-backend
    runtime: python
    plan: free
    region: singapore # matches the Supabase project region (ap-southeast-1)
    rootDir: backend # app, requirements.txt, and alembic.ini live here
    buildCommand: pip install -r requirements.txt
    # Apply migrations, then serve on the port Render provides via $PORT.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Not secret — the frontend's Vercel origin(s) allowed to call the API.
      # Add preview/custom domains as more JSON array entries.
      - key: CORS_ORIGINS
        value: '["https://code-phoenix-productivity-toolkit.vercel.app"]'
      # Secrets — leave unset here and fill them in the Render dashboard so they
      # never land in the repo:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # Cloudflare Realtime TURN, from the dashboard's TURN Server app. The
      # backend exchanges this long-term key for short-lived credentials on each
      # /cowork-sessions/ice-config call, so the key never reaches a browser.
      # Without TURN, peers on restrictive networks (office / campus Wi-Fi)
      # cannot connect to each other at all.
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_KEY_API_TOKEN
        sync: false
      # Cloudflare Realtime SFU app (separate from the TURN key). Video routes
      # through Cloudflare's edge; without these the rooms still run in
      # presence-and-tasks-only mode and say so in the UI.
      - key: SFU_APP_ID
        sync: false
      - key: SFU_APP_SECRET
        sync: false
